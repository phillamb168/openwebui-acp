name: Build unsigned candidate artifacts
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  checks:
    if: github.ref == 'refs/heads/main'
    uses: ./.github/workflows/check.yml
  package:
    needs: checks
    strategy:
      matrix:
        include:
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
          - os: macos-15
            target: aarch64-apple-darwin
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de
        with:
          toolchain: 1.98.1
          targets: ${{ matrix.target }}
      - name: Build locked release
        env:
          TARGET: ${{ matrix.target }}
        run: |
          export RUSTFLAGS="--remap-path-prefix=$GITHUB_WORKSPACE=/source --remap-path-prefix=$HOME/.cargo=/cargo"
          cargo build --release --locked --target "$TARGET" --bin openwebui-acp
          "target/$TARGET/release/openwebui-acp" --version
          python3 scripts/package.py --binary "target/$TARGET/release/openwebui-acp" --target "$TARGET"
      - if: matrix.target == 'x86_64-unknown-linux-gnu'
        run: python3 scripts/package.py --source
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: openwebui-acp-${{ matrix.target }}
          path: dist/openwebui-acp-*.tar.gz*
          if-no-files-found: error
          retention-days: 14
  deployment-artifacts:
    needs: checks
    strategy:
      matrix:
        include:
          - os: ubuntu-24.04
            arch: amd64
          - os: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: ./.github/actions/test-tools
      - name: Build unsigned deployment artifacts
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          mkdir -p dist
          version=$(python3 -c 'import tomllib; print(tomllib.load(open("Cargo.toml", "rb"))["package"]["version"])')
          docker build -t "openwebui-acp-sidecar:$version-$ARCH" -f deploy/sidecar/Dockerfile .
          docker save "openwebui-acp-sidecar:$version-$ARCH" | gzip -n > "dist/openwebui-acp-sidecar-$version-$ARCH.tar.gz"
          helm package deploy/chart --destination dist
          cd dist
          sha256sum *.tar.gz *.tgz > SHA256SUMS
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: deployment-${{ matrix.arch }}
          path: dist/*
          if-no-files-found: error
          retention-days: 14
