[package]
name = "openwebui-acp"
version = "0.1.0-rc.2"
edition = "2024"
rust-version = "1.98"
description = "ACP v1 stdio adapter for Open WebUI Workspace models"
license = "MIT"
repository = "https://github.com/phillamb168/openwebui-acp"
include = ["src/**", "examples/smoke.rs", "Cargo.toml", "Cargo.lock", "README.md", "LICENSE", "THIRD_PARTY_NOTICES.md", "licenses/**"]

[dependencies]
agent-client-protocol = "=2.1.0"
clap = { version = "4", features = ["derive"] }
dotenvy = "0.15"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time", "process", "io-util", "signal"] }
tokio-util = { version = "0.7", features = ["rt"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4", "serde"] }
futures = "0.3"
blocking = "1.6"
fs2 = "0.4"
rustix = { version = "1", features = ["fs", "process"] }
sha2 = "0.10"
base64 = "0.22"
zeroize = "1"
nostr = { version = "0.44", features = ["nip98"] }
buzz-sdk = { version = "=0.1.0", git = "https://github.com/block/buzz", rev = "f87c10895ea35a9a2cea629fef1d7532a3fecbc5" }

[dev-dependencies]
tempfile = "3"
wiremock = "0.6"

[profile.release]
strip = true
lto = "thin"
