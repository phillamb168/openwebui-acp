pid /tmp/nginx.pid;
events { worker_connections 128; }
http {
  client_body_temp_path /tmp/client;
  proxy_temp_path /tmp/proxy;
  fastcgi_temp_path /tmp/fastcgi;
  uwsgi_temp_path /tmp/uwsgi;
  scgi_temp_path /tmp/scgi;
  client_max_body_size 20m;
  server { listen 8080; location / { proxy_pass http://webui:8080; proxy_set_header Host $http_host; proxy_http_version 1.1; proxy_set_header Upgrade $http_upgrade; proxy_set_header Connection "upgrade"; proxy_read_timeout 120s; proxy_buffering off; } }
  server { listen 8000; location / { proxy_pass http://fixture:8000; } }
}
