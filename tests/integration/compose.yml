name: openwebui-acp-test
services:
  gateway:
    image: nginx:1.28-alpine
    user: "101:101"
    entrypoint: ["nginx", "-g", "daemon off;"]
    volumes: ["./nginx.conf:/etc/nginx/nginx.conf:ro"]
    ports: ["127.0.0.1::8080", "127.0.0.1::8000"]
    networks: [test, access]
    depends_on: [webui, fixture]
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
  fixture:
    image: python:3.12-slim
    command: ["python", "/fixture/server.py"]
    volumes: ["./server.py:/fixture/server.py:ro"]
    networks: [test]
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
  webui:
    image: ghcr.io/open-webui/open-webui:v0.12.0@sha256:1565038903151ced924b5a3226f73f40f16963df4b910441f6391f10144afdaa
    environment:
      WEBUI_SECRET_KEY: disposable-integration-only-not-a-real-secret
      ENABLE_PERSISTENT_CONFIG: "False"
      ENABLE_API_KEYS: "True"
      ENABLE_SIGNUP: "True"
      ENABLE_OLLAMA_API: "False"
      OPENAI_API_BASE_URL: http://fixture:8000/v1
      OPENAI_API_KEY: disposable-fixture-only
      RAG_EMBEDDING_ENGINE: openai
      RAG_EMBEDDING_MODEL: fixture-embedding
      RAG_OPENAI_API_BASE_URL: http://fixture:8000/v1
      RAG_OPENAI_API_KEY: disposable-fixture-only
      ENABLE_MEMORIES: "False"
      ENABLE_VERSION_UPDATE_CHECK: "False"
      ANONYMIZED_TELEMETRY: "False"
      DO_NOT_TRACK: "True"
      SCARF_NO_ANALYTICS: "True"
      OFFLINE_MODE: "True"
      HF_HUB_OFFLINE: "1"
      ENABLE_CHANNELS: "False"
    volumes: ["webui:/app/backend/data"]
    networks: [test]
    depends_on: [fixture]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=5)"]
      interval: 5s
      timeout: 6s
      retries: 36
    mem_limit: 4g
networks:
  access: {}
  test:
    internal: true
volumes:
  webui:
