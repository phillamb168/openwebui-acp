name: openwebui-acp-relay-test
services:
  relay:
    image: ghcr.io/block/buzz:0.2.1@sha256:4e31b7c7abb7d00b6f513dc559e58d2b980416f1dc400aa01bcf762cf2989cfc
    env_file: ../../.work/integration/relay.env
    environment:
      BUZZ_BIND_ADDR: 0.0.0.0:3000
      RELAY_URL: ws://relay:3000
      BUZZ_HEALTH_PORT: "8080"
      BUZZ_REQUIRE_AUTH_TOKEN: "true"
      BUZZ_REQUIRE_RELAY_MEMBERSHIP: "true"
      BUZZ_ALLOW_NIP_OA_AUTH: "true"
      DATABASE_URL: postgres://fixture:disposable@postgres:5432/fixture
      REDIS_URL: redis://redis:6379
      BUZZ_S3_ENDPOINT: http://minio:9000
      BUZZ_S3_ADDRESSING_STYLE: path
      BUZZ_S3_ACCESS_KEY: disposable
      BUZZ_S3_SECRET_KEY: disposable-test-password
      BUZZ_S3_BUCKET: fixture
      BUZZ_GIT_REPO_PATH: /data/git
      BUZZ_AUTO_MIGRATE: "true"
      BUZZ_GIT_CONFORMANCE_PROBE: "false"
    ports: ["127.0.0.1::3000"]
    volumes: ["git:/data/git"]
    healthcheck:
      test: ["CMD-SHELL", "bash -ec 'exec 3<>/dev/tcp/127.0.0.1/8080; printf \"GET /_readiness HTTP/1.0\\r\\nHost: localhost\\r\\n\\r\\n\" >&3; grep -q \"200 OK\" <&3'"]
      interval: 2s
      timeout: 3s
      retries: 60
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
      minio-init: {condition: service_completed_successfully}
  postgres:
    image: postgres:17-alpine
    environment: {POSTGRES_USER: fixture, POSTGRES_PASSWORD: disposable, POSTGRES_DB: fixture}
    volumes: ["postgres:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "fixture", "-d", "fixture"]
      interval: 2s
      retries: 30
  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      retries: 30
  minio:
    image: pgsty/silo:RELEASE.2026-09-16T00-00-00Z@sha256:635197cb9f36d01bee221d34d1c7d7960f6a95c48b0b6c01d99cd13bdae51a46
    command: ["server", "/data"]
    environment: {MINIO_ROOT_USER: disposable, MINIO_ROOT_PASSWORD: disposable-test-password}
    volumes: ["minio:/data"]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:9000/minio/health/live"]
      interval: 2s
      retries: 30
  minio-init:
    image: pgsty/mc:RELEASE.2026-09-16T00-00-00Z@sha256:cfc83108c3abb371f8fb84d99c1fdc88f8c237e022409b0081fb7c0a3be634dd
    depends_on:
      minio: {condition: service_healthy}
    entrypoint: ["/bin/sh", "-ec", "mc alias set local http://minio:9000 disposable disposable-test-password; mc mb --ignore-existing local/fixture; mc anonymous set none local/fixture"]
  agent:
    image: openwebui-acp-sidecar:local
    profiles: [agent]
    env_file: ../../.work/integration/agent.env
    environment:
      OPENWEBUI_URL: http://webui:8080
      BUZZ_RELAY_URL: ws://relay:3000
      OPENWEBUI_MODEL: fixture-tool
      OPENWEBUI_ACP_ALLOW_INSECURE_HTTP: "true"
      OPENWEBUI_ACP_MEMORY_DEFAULT: "false"
      RUST_LOG: warn,buzz_acp=info
    volumes:
      - agent-secrets:/run/secrets:ro
      - agent-state:/state
    networks: [default, webui]
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    stop_grace_period: 15s
volumes:
  git: {}
  postgres: {}
  minio: {}
  agent-state: {}
  agent-secrets: {}
networks:
  webui:
    external: true
    name: openwebui-acp-test_test
